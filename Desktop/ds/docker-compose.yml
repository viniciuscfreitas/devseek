version: "3.9"

services:
  app:
    build:
      context: .
      target: dev
    command: pnpm dev
    ports:
      - "3000:3000"
    env_file:
      - env.example
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devscout?schema=public
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - .:/app
      - pnpm-store:/pnpm
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    tty: true

  worker:
    build:
      context: .
      target: dev
    command: pnpm run dev:worker
    env_file:
      - env.example
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devscout?schema=public
    volumes:
      - .:/app
      - pnpm-store:/pnpm
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  pnpm-store:
  node_modules:


